<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#0e0f11;--bg2:#15171a;--bg3:#1c1f23;--bg4:#22262c;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
    --text:#e8eaed;--text2:#8b9099;--text3:#555c66;
    --blue:#4a9eff;--blue-dim:rgba(74,158,255,0.12);
    --green:#3dd68c;--green-dim:rgba(61,214,140,0.1);
    --red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);
    --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);
    --radius:10px;--radius-lg:14px;
    --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
  .app{max-width:1400px;margin:0 auto;padding:24px 20px}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;align-items:center;gap:16px}
  .logo{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text);letter-spacing:-.3px}
  .logo span{color:var(--blue)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .last-updated{font-size:11px;color:var(--text3);font-family:var(--mono)}
  .header-right{display:flex;gap:8px;align-items:center}
  .btn{font-family:var(--sans);font-size:12px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .btn:hover{background:var(--bg4);color:var(--text)}
  .btn.accent{background:var(--blue-dim);color:var(--blue);border-color:rgba(74,158,255,0.25)}
  .btn.accent:hover{background:rgba(74,158,255,0.2)}
  .model-nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .model-tab{font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text3);transition:all .15s;text-align:center;line-height:1.4}
  .model-tab:hover{color:var(--text2);border-color:var(--border2)}
  .model-tab.active{background:var(--bg3);color:var(--blue);border-color:rgba(74,158,255,0.3)}
  .sleeve-tabs{display:flex;gap:4px;margin-bottom:20px}
  .sleeve-tab{font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text3);transition:all .15s}
  .sleeve-tab.active{background:var(--bg3);color:var(--text);border-color:var(--border2)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:var(--mono)}
  .metric-value{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--text)}
  .metric-value.pos{color:var(--green)}.metric-value.neg{color:var(--red)}
  .metric-sub{font-size:11px;margin-top:3px;font-family:var(--mono);color:var(--text3)}
  .metric-sub.pos{color:var(--green)}.metric-sub.neg{color:var(--red)}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px}
  .card-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:14px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
  .ch{position:relative;width:100%}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
  th:first-child{text-align:left}
  td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);text-align:right;font-family:var(--mono);font-size:12px}
  td:first-child{text-align:left;font-family:var(--sans)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--bg3)}
  .tk{font-weight:500;font-size:12px;color:var(--text)}
  .tk-name{font-size:10px;color:var(--text3);margin-top:1px;font-family:var(--sans)}
  .pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--text3)}
  .drift-bar{height:3px;border-radius:2px;background:var(--bg4);width:48px;display:inline-block;vertical-align:middle;overflow:hidden}
  .drift-fill{height:3px;border-radius:2px}
  .pill{font-size:10px;padding:2px 8px;border-radius:20px;font-family:var(--mono);font-weight:500}
  .pill.buy{background:var(--green-dim);color:var(--green)}
  .pill.sell{background:var(--red-dim);color:var(--red)}
  .pill.hold{background:var(--bg4);color:var(--text3)}
  .rebal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .rebal-row:last-child{border-bottom:none}
  .rebal-left{display:flex;flex-direction:column;gap:2px}
  .rebal-right{display:flex;align-items:center;gap:12px}
  .rebal-amount{font-family:var(--mono);font-size:12px;color:var(--text2)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);font-family:var(--mono)}
  .legend-sq{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .vtabs{display:flex;gap:3px;margin-bottom:10px}
  .vtab{font-size:10px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text3);font-family:var(--mono)}
  .vtab.active{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
  .status{display:flex;align-items:center;gap:10px;padding:40px 0;color:var(--text3);font-size:13px;justify-content:center}
  .spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-banner{background:var(--red-dim);border:1px solid rgba(255,107,107,0.2);border-radius:var(--radius);padding:12px 16px;font-size:12px;color:var(--red);margin-bottom:12px;font-family:var(--mono);line-height:1.6}
  .warn-banner{background:var(--amber-dim);border:1px solid rgba(245,166,35,0.2);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:12px;font-family:var(--mono)}
  .footnote{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:center;padding:16px 0 4px}
  .mb{margin-bottom:12px}
  .cors-help{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 28px;max-width:600px;margin:40px auto}
  .cors-help h2{font-family:var(--mono);font-size:14px;color:var(--blue);margin-bottom:12px}
  .cors-help p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:10px}
  .cors-help code{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:8px 12px;display:block;font-family:var(--mono);font-size:11px;color:var(--text);margin:10px 0;word-break:break-all}
  .cors-help ol{padding-left:18px;font-size:13px;color:var(--text2);line-height:2}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">port<span>.</span>tracker</div>
      <div class="last-updated"><span class="live-dot"></span><span id="updated-time">loading…</span></div>
    </div>
    <div class="header-right">
      <button class="btn" onclick="refreshAll()">↻ refresh</button>
      <button class="btn accent" onclick="toggleRebal()">⊞ rebalance</button>
    </div>
  </div>

  <div class="model-nav" id="model-nav"></div>
  <div class="sleeve-tabs" id="sleeve-tabs"></div>
  <div id="err-area"></div>
  <div id="status-area" class="status"><div class="spinner"></div><span id="status-msg">Loading…</span></div>

  <div id="main" style="display:none">
    <div class="metrics" id="metrics"></div>
    <div class="grid-2 mb">
      <div class="card">
        <div class="card-title">performance since jan 1 2026</div>
        <div class="ch" style="height:190px"><canvas id="perf-chart" role="img" aria-label="Portfolio performance since Jan 1 2026"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">allocation</div>
        <div class="vtabs">
          <button class="vtab active" onclick="setAllocView('weight')">weight</button>
          <button class="vtab" onclick="setAllocView('sector')">sector</button>
          <button class="vtab" onclick="setAllocView('geo')">geography</button>
          <button class="vtab" onclick="setAllocView('currency')">currency</button>
        </div>
        <div class="legend" id="alloc-legend"></div>
        <div class="ch" style="height:130px"><canvas id="alloc-chart" role="img" aria-label="Allocation breakdown"></canvas></div>
      </div>
    </div>
    <div id="rebal-section" style="display:none" class="card mb">
      <div class="card-title">⊞ rebalance — trades needed to restore target weights</div>
      <div id="rebal-content"></div>
    </div>
    <div class="card mb">
      <div class="card-title" id="holdings-title">holdings</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>ticker</th><th>price</th><th>day chg</th>
            <th>target wt</th><th>curr wt</th><th>drift</th>
            <th>mkt val (CAD)</th><th>ytd gain/loss</th>
          </tr></thead>
          <tbody id="holdings-body"></tbody>
        </table>
      </div>
    </div>
    <div class="grid-3 mb">
      <div class="card"><div class="card-title">sector</div><div class="legend" id="sector-legend"></div><div class="ch" style="height:150px"><canvas id="sector-chart" role="img" aria-label="Sector breakdown"></canvas></div></div>
      <div class="card"><div class="card-title">geography</div><div class="legend" id="geo-legend"></div><div class="ch" style="height:150px"><canvas id="geo-chart" role="img" aria-label="Geographic breakdown"></canvas></div></div>
      <div class="card"><div class="card-title">currency exposure</div><div class="legend" id="curr-legend"></div><div class="ch" style="height:150px"><canvas id="curr-chart" role="img" aria-label="Currency breakdown"></canvas></div></div>
    </div>
    <div class="footnote" id="footnote"></div>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const SHEET_ID = '1Is6Klorkyyy2F-TKLFKentZuP00Rn0OlCwLpbyf7tAY';
const API_KEY  = 'AIzaSyDIXN_Bj8fWRydDxEoNfVsMezvvhcXN0iQ';
const EQUITY_AUM  = 630000;
const FIXED_AUM   = 350000;
const CASH_EQUITY = 20000;
const SOLO_AUM    = 198000;
const SOLO_CASH   = 2000;
const COLORS = ['#4a9eff','#3dd68c','#f5a623','#ff6b6b','#c084fc','#fb923c','#34d399','#60a5fa','#f472b6','#a78bfa','#fbbf24','#4ade80','#f87171','#38bdf8'];

// ── STATE ────────────────────────────────────────────────────────────────────
let models=[], holdings=[], pairings=[];
let priceData={}, usdcadRate=1.363;
let activeModelId=1, activeSleeve='pair', allocView='weight';
let charts={}, rebalOpen=false, failed=[];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function $(id){return document.getElementById(id);}
const setStatus=msg=>$('status-msg').textContent=msg;
const showStatus=v=>$('status-area').style.display=v?'flex':'none';
const showMain=v=>$('main').style.display=v?'block':'none';
function fmt(n,d=0){if(isNaN(n)||n==null)return'—';const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(2)+'M':n.toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtC(n){return(n<0?'-$':'$')+fmt(Math.abs(n));}
function fmtP(n){return(n>=0?'+':'')+n.toFixed(2)+'%';}
function toCad(val,cur){return cur==='USD'?val*usdcadRate:val;}
function destroyChart(k){if(charts[k]){charts[k].destroy();charts[k]=null;}}

// ── SHEET LOADING ────────────────────────────────────────────────────────────
async function fetchSheetRange(range){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
  const r=await fetch(url);
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`);}
  return (await r.json()).values||[];
}

function parseModels(rows){
  const h=rows[0].map(x=>x.toLowerCase().trim());
  return rows.slice(1).map(r=>{
    const o={};h.forEach((k,i)=>o[k]=r[i]||'');
    return{id:+o.model_id,name:o.model_name,type:o.model_type,currency:o.reporting_currency,
      aum:parseFloat((o.total_aum||'').replace(/[$,]/g,''))||1000000,desc:o.description};
  });
}
function parseHoldings(rows){
  const h=rows[0].map(x=>x.toLowerCase().trim());
  return rows.slice(1).map(r=>{
    const o={};h.forEach((k,i)=>o[k]=r[i]||'');
    if(!o.ticker)return null;
    return{modelId:+o.model_id,ticker:o.ticker.trim(),name:o.name,
      currency:(o.currency||'CAD').trim().toUpperCase(),weight:parseFloat(o.target_weight)||0,addedDate:o.added_date};
  }).filter(Boolean);
}
function parsePairings(rows){
  if(rows.length<2)return[];
  const h=rows[0].map(x=>x.toLowerCase().replace(/[_\s]/g,''));
  return rows.slice(1).map(r=>{
    const o={};h.forEach((k,i)=>o[k]=r[i]||'');
    const eKey=Object.keys(o).find(k=>k.includes('equity'));
    const fKey=Object.keys(o).find(k=>k.includes('fixed'));
    return{equityId:+(o[eKey]||0),fixedId:+(o[fKey]||0)};
  }).filter(x=>x.equityId&&x.fixedId);
}

async function loadSheet(){
  setStatus('Reading Google Sheet…');
  const [mR,hR,pR]=await Promise.all([
    fetchSheetRange('Models!A1:F20'),
    fetchSheetRange('Holdings!A1:G300'),
    fetchSheetRange('Pairings!A1:C20'),
  ]);
  models=parseModels(mR);
  holdings=parseHoldings(hR);
  pairings=parsePairings(pR);
}

// ── PRICE FETCHING ───────────────────────────────────────────────────────────
async function fetchYahoo(ticker){
  // Try multiple CORS proxies in order
  const proxies=[
    url=>`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];
  const yUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=6mo`;
  for(const makeProxy of proxies){
    try{
      const r=await fetch(makeProxy(yUrl),{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const j=await r.json();
      const raw=typeof j.contents==='string'?JSON.parse(j.contents):j;
      const res=(raw.chart||raw).result?.[0];
      if(!res)continue;
      const meta=res.meta;
      const closes=res.indicators.quote[0].close;
      const ts=res.timestamp;
      const valid=closes.map((c,i)=>({c,t:ts[i]})).filter(x=>x.c!=null);
      if(!valid.length)continue;
      const current=meta.regularMarketPrice||valid[valid.length-1].c;
      const prev=meta.chartPreviousClose||valid[valid.length-2]?.c||current;
      const dayChg=((current-prev)/prev)*100;
      const jan1=valid.find(x=>{const d=new Date(x.t*1000);return d>=new Date('2026-01-02')&&d<=new Date('2026-01-15');})?.c||valid[0].c;
      const totalRet=((current-jan1)/jan1)*100;
      const curve=valid.slice(-120).map(x=>({t:x.t,c:x.c}));
      return{current,prev,dayChg,jan1,totalRet,curve};
    }catch(e){continue;}
  }
  return null;
}

async function fetchUSDCAD(){
  try{
    const d=await fetchYahoo('CADUSD=X');
    if(d&&d.current>0)usdcadRate=1/d.current;
  }catch(e){}
}

async function fetchAllPrices(){
  const tickers=[...new Set(holdings.map(h=>h.ticker))];
  failed=[];
  const BATCH=4;
  for(let i=0;i<tickers.length;i+=BATCH){
    const batch=tickers.slice(i,i+BATCH);
    setStatus(`Fetching prices… (${Math.min(i+BATCH,tickers.length)}/${tickers.length})`);
    await Promise.all(batch.map(async t=>{
      if(priceData[t])return;
      const d=await fetchYahoo(t);
      if(d)priceData[t]=d;
      else failed.push(t);
    }));
  }
}

// ── DATA HELPERS ─────────────────────────────────────────────────────────────
function getActiveModel(){return models.find(m=>m.id===activeModelId)||models[0];}
function getFixedModel(){const p=pairings.find(x=>x.equityId===activeModelId);return p?models.find(m=>m.id===p.fixedId):null;}

function isEquityHolding(h){return models.find(m=>m.id===h.modelId)?.type==='equity';}

function sleeveAUM(h){
  const m=getActiveModel();
  if(m.id===6)return SOLO_AUM;
  return isEquityHolding(h)?EQUITY_AUM:FIXED_AUM;
}

function computeStats(h){
  const p=priceData[h.ticker];if(!p)return null;
  const sAUM=sleeveAUM(h);
  const targetCAD=h.weight*sAUM;
  const jan1CAD=toCad(p.jan1,h.currency);
  const shares=jan1CAD>0?targetCAD/jan1CAD:0;
  const currentCAD=toCad(p.current,h.currency);
  const currentValCAD=shares*currentCAD;
  const gainCAD=currentValCAD-targetCAD;
  return{shares,targetCAD,currentValCAD,gainCAD,gainPct:p.totalRet,dayChg:p.dayChg,currentCAD,current:p.current};
}

function getDisplayHoldings(){
  const m=getActiveModel();
  const pair=pairings.find(p=>p.equityId===m.id);
  const equityH=holdings.filter(h=>h.modelId===m.id);
  const fixedH=pair?holdings.filter(h=>h.modelId===pair.fixedId):[];
  if(m.type==='equity'&&pair){
    if(activeSleeve==='equity')return equityH;
    if(activeSleeve==='fixed')return fixedH;
    return[...equityH,...fixedH];
  }
  return equityH;
}

function getActiveHoldingsMeta(){
  const m=getActiveModel();
  const pair=pairings.find(p=>p.equityId===m.id);
  const hasFixed=m.type==='equity'&&pair;
  return{hasFixed,mode:hasFixed?activeSleeve:'solo'};
}

// ── RENDER: MODEL NAV ─────────────────────────────────────────────────────────
function buildModelNav(){
  const equityModels=models.filter(m=>m.type==='equity');
  $('model-nav').innerHTML=equityModels.map(m=>{
    const pair=pairings.find(p=>p.equityId===m.id);
    const sub=pair?`+ Fixed/Alts`:`standalone`;
    return`<button class="model-tab${m.id===activeModelId?' active':''}" onclick="switchModel(${m.id})">${m.name}<br><span style="font-size:9px;opacity:.5">${m.desc} · ${sub}</span></button>`;
  }).join('');
}

function buildSleeveTabs(){
  const{hasFixed}=getActiveHoldingsMeta();
  const el=$('sleeve-tabs');
  if(!hasFixed){el.innerHTML='';return;}
  el.innerHTML=[['pair','Pair (Equity + Fixed)'],['equity','Equity only'],['fixed','Fixed / Alts only']]
    .map(([v,l])=>`<button class="sleeve-tab${activeSleeve===v?' active':''}" onclick="setSleeve('${v}')">${l}</button>`).join('');
}

// ── RENDER: METRICS ───────────────────────────────────────────────────────────
function renderMetrics(){
  const dh=getDisplayHoldings();
  let totalVal=0,totalCost=0,dayPL=0;
  dh.forEach(h=>{const s=computeStats(h);if(!s)return;totalVal+=s.currentValCAD;totalCost+=s.targetCAD;dayPL+=s.currentValCAD*(s.dayChg/100);});
  const m=getActiveModel();
  const{mode}=getActiveHoldingsMeta();
  const cash=m.id===6?SOLO_CASH:mode==='fixed'?0:CASH_EQUITY;
  totalVal+=cash;
  const gain=totalVal-totalCost-cash;
  const gainPct=totalCost>0?(gain/totalCost)*100:0;
  const dayPct=totalVal>0?(dayPL/totalVal)*100:0;
  $('metrics').innerHTML=[
    {l:'portfolio value',v:'$'+fmt(totalVal)},
    {l:'ytd gain / loss',v:fmtC(gain),s:fmtP(gainPct),pos:gain>=0},
    {l:'day p&l',v:fmtC(dayPL),s:fmtP(dayPct),pos:dayPL>=0},
    {l:'cash (CAD)',v:'$'+fmt(cash)},
    {l:'usd / cad',v:usdcadRate.toFixed(4),s:'live rate'},
  ].map(c=>`<div class="metric"><div class="metric-label">${c.l}</div>
    <div class="metric-value${c.pos===true?' pos':c.pos===false?' neg':''}">${c.v}</div>
    ${c.s?`<div class="metric-sub${c.pos===true?' pos':c.pos===false?' neg':''}">${c.s}</div>`:''}</div>`).join('');
}

// ── RENDER: HOLDINGS TABLE ────────────────────────────────────────────────────
function renderHoldings(){
  const dh=getDisplayHoldings();
  const totalPort=dh.reduce((s,h)=>{const st=computeStats(h);return s+(st?st.currentValCAD:0);},0);
  const{mode}=getActiveHoldingsMeta();
  const m=getActiveModel();
  $('holdings-title').textContent=`holdings — ${m.name}${mode==='pair'?' (equity + fixed)':mode==='fixed'?' (fixed/alts)':''}`;
  $('holdings-body').innerHTML=dh.map(h=>{
    const s=computeStats(h);const p=priceData[h.ticker];
    if(!s||!p)return`<tr><td><div class="tk">${h.ticker.replace('.TO','')}</div><div class="tk-name">${h.name}</div></td><td colspan="7" class="muted" style="font-size:11px">price unavailable</td></tr>`;
    const currWt=totalPort>0?s.currentValCAD/totalPort:h.weight;
    const drift=currWt-h.weight;
    const barW=Math.min(48,Math.abs(drift)*600);
    const barCol=Math.abs(drift)<0.008?'#3dd68c':drift>0?'#4a9eff':'#ff6b6b';
    return`<tr>
      <td><div class="tk">${h.ticker.replace('.TO','')}</div><div class="tk-name">${h.name}</div></td>
      <td>${h.currency==='USD'?'US$':'C$'}${fmt(p.current,2)}</td>
      <td class="${p.dayChg>=0?'pos':'neg'}">${fmtP(p.dayChg)}</td>
      <td class="muted">${(h.weight*100).toFixed(1)}%</td>
      <td>${(currWt*100).toFixed(1)}%</td>
      <td><span class="${drift>=0?'pos':'neg'}" style="font-size:10px">${drift>=0?'+':''}${(drift*100).toFixed(1)}%</span> <div class="drift-bar"><div class="drift-fill" style="width:${barW}px;background:${barCol}"></div></div></td>
      <td>$${fmt(s.currentValCAD)}</td>
      <td class="${s.gainCAD>=0?'pos':'neg'}">${fmtC(s.gainCAD)} <span style="opacity:.6;font-size:10px">${fmtP(s.gainPct)}</span></td>
    </tr>`;
  }).join('');
}

// ── RENDER: PERF CHART ────────────────────────────────────────────────────────
function renderPerfChart(){
  const dh=getDisplayHoldings();
  const curves=dh.map(h=>{
    const p=priceData[h.ticker];if(!p||!p.curve)return null;
    const sAUM=sleeveAUM(h);
    const shares=(h.weight*sAUM)/toCad(p.jan1,h.currency);
    return p.curve.map(pt=>({t:pt.t,v:shares*toCad(pt.c,h.currency)}));
  }).filter(Boolean);
  if(!curves.length)return;
  const minLen=Math.min(...curves.map(c=>c.length));
  const labels=[],vals=[];
  for(let i=0;i<minLen;i++){
    labels.push(new Date(curves[0][i].t*1000).toLocaleDateString('en-CA',{month:'short',day:'numeric'}));
    vals.push(+curves.reduce((s,c)=>s+(c[i]?.v||0),0).toFixed(2));
  }
  destroyChart('perf');
  charts.perf=new Chart($('perf-chart'),{
    type:'line',
    data:{labels,datasets:[{label:'Value',data:vals,borderColor:'#4a9eff',backgroundColor:'rgba(74,158,255,0.08)',fill:true,tension:0.4,pointRadius:0,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#555c66',maxRotation:0,maxTicksLimit:7,font:{size:10}},grid:{color:'rgba(255,255,255,0.04)'}},
              y:{ticks:{color:'#555c66',font:{size:10},callback:v=>'$'+fmt(v)},grid:{color:'rgba(255,255,255,0.04)'}}}}
  });
}

// ── RENDER: DONUT CHARTS ──────────────────────────────────────────────────────
function groupBy(arr,key){
  const m={};
  arr.forEach(h=>{const s=computeStats(h);if(!s)return;const k=h[key]||'Other';m[k]=(m[k]||0)+s.currentValCAD;});
  return m;
}
function makeDonut(canvasId,legendId,dataMap){
  const labels=Object.keys(dataMap),vals=labels.map(k=>+dataMap[k].toFixed(2));
  const total=vals.reduce((a,b)=>a+b,0);
  const colors=COLORS.slice(0,labels.length);
  const leg=$(legendId);
  if(leg)leg.innerHTML=labels.map((l,i)=>`<div class="legend-item"><span class="legend-sq" style="background:${colors[i]}"></span>${l} ${((vals[i]/total)*100).toFixed(1)}%</div>`).join('');
  return{labels,datasets:[{data:vals,backgroundColor:colors,borderWidth:0,hoverOffset:4}]};
}
function renderAllocChart(){
  const dh=getDisplayHoldings();
  const dm=allocView==='sector'?groupBy(dh,'sector'):allocView==='geo'?groupBy(dh,'geo'):allocView==='currency'?groupBy(dh,'currency'):(()=>{const m={};dh.forEach(h=>{const s=computeStats(h);if(s)m[h.ticker.replace('.TO','')]=s.currentValCAD;});return m;})();
  destroyChart('alloc');
  charts.alloc=new Chart($('alloc-chart'),{type:'doughnut',data:makeDonut('alloc-chart','alloc-legend',dm),options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'62%'}});
}
function renderBreakdowns(){
  const dh=getDisplayHoldings();
  [['sector','sector'],['geo','geo'],['currency','curr']].forEach(([key,id])=>{
    destroyChart(id);
    charts[id]=new Chart($(`${id}-chart`),{type:'doughnut',data:makeDonut(`${id}-chart`,`${id}-legend`,groupBy(dh,key)),options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'58%'}});
  });
}

// ── RENDER: REBALANCE ─────────────────────────────────────────────────────────
function renderRebal(){
  const dh=getDisplayHoldings();
  $('rebal-content').innerHTML=dh.map(h=>{
    const s=computeStats(h);const p=priceData[h.ticker];
    if(!s||!p)return'';
    const diff=s.targetCAD-s.currentValCAD;
    if(Math.abs(diff)<300)return`<div class="rebal-row"><div class="rebal-left"><span style="font-size:12px;font-weight:500;font-family:var(--mono)">${h.ticker.replace('.TO','')}</span><span style="font-size:10px;color:var(--text3)">${h.name}</span></div><span class="pill hold">hold</span></div>`;
    const action=diff>0?'buy':'sell';
    const diffShares=Math.abs(diff)/toCad(p.current,h.currency);
    return`<div class="rebal-row">
      <div class="rebal-left"><span style="font-size:12px;font-weight:500;font-family:var(--mono)">${h.ticker.replace('.TO','')}</span><span style="font-size:10px;color:var(--text3)">${h.name}</span></div>
      <div class="rebal-right"><span class="rebal-amount">${action==='buy'?'+':'−'}${diffShares.toFixed(2)} shares</span><span class="rebal-amount">${fmtC(Math.abs(diff))}</span><span class="pill ${action}">${action}</span></div>
    </div>`;
  }).join('')||'<p style="font-size:12px;color:var(--text3);padding:8px 0">All positions within tolerance — no trades needed.</p>';
}

// ── RENDER ALL ────────────────────────────────────────────────────────────────
function renderAll(){
  renderMetrics();renderHoldings();renderPerfChart();renderAllocChart();renderBreakdowns();
  if(rebalOpen)renderRebal();
}

// ── EVENT HANDLERS ────────────────────────────────────────────────────────────
function switchModel(id){activeModelId=id;activeSleeve='pair';buildModelNav();buildSleeveTabs();renderAll();}
function setSleeve(v){activeSleeve=v;buildSleeveTabs();renderAll();}
function setAllocView(v){
  allocView=v;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('active',
    (v==='weight'&&t.textContent==='weight')||(v==='sector'&&t.textContent==='sector')||
    (v==='geo'&&t.textContent==='geography')||(v==='currency'&&t.textContent==='currency')));
  renderAllocChart();
}
function toggleRebal(){rebalOpen=!rebalOpen;$('rebal-section').style.display=rebalOpen?'block':'none';if(rebalOpen)renderRebal();}

function showWarnings(){
  $('err-area').innerHTML=failed.length?`<div class="warn-banner">⚠ Price unavailable for: ${failed.join(', ')} — check tickers in your sheet (Canadian stocks need .TO suffix)</div>`:'';
}

async function refreshAll(){
  priceData={};showMain(false);showStatus(true);
  try{
    await fetchUSDCAD();await fetchAllPrices();showWarnings();
    buildModelNav();buildSleeveTabs();showStatus(false);showMain(true);renderAll();
    $('updated-time').textContent='updated '+new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'});
    $('footnote').textContent=`Live prices via Yahoo Finance · USD/CAD ${usdcadRate.toFixed(4)} · Cost basis: Jan 1 2026 · ${new Date().toLocaleDateString('en-CA')}`;
  }catch(e){showStatus(false);$('err-area').innerHTML=`<div class="err-banner">Error refreshing prices: ${e.message}</div>`;}
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  showStatus(true);
  try{
    await loadSheet();
    if(!models.length)throw new Error('No models found — check sheet tab is named "Models" (capital M)');
    await fetchUSDCAD();
    await fetchAllPrices();
    showWarnings();
    activeModelId=models.find(m=>m.type==='equity')?.id||models[0].id;
    buildModelNav();buildSleeveTabs();showStatus(false);showMain(true);renderAll();
    $('updated-time').textContent='updated '+new Date().toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'});
    $('footnote').textContent=`Live prices via Yahoo Finance · USD/CAD ${usdcadRate.toFixed(4)} · Cost basis: Jan 1 2026 · ${new Date().toLocaleDateString('en-CA')}`;
  }catch(e){
    showStatus(false);
    $('err-area').innerHTML=`<div class="err-banner">
      ⚠ Failed to load: ${e.message}<br><br>
      To fix this, open the file from a local web server instead of double-clicking it:<br>
      1. Open Terminal (Mac) or Command Prompt (Windows)<br>
      2. Navigate to the folder containing portfolio-tracker.html<br>
      3. Run: <strong>python3 -m http.server 8080</strong><br>
      4. Open Chrome and go to: <strong>http://localhost:8080/portfolio-tracker.html</strong>
    </div>`;
  }
}
init();
</script>
